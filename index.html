<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizador de QR Code</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #ffffff;
    }
    .card {
      text-align: center;
      padding: 20px;
      max-width: 320px;
      width: 100%;
    }
    .nome {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .qrcode-container img {
      width: 100%;
      max-width: 260px;
      height: auto;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="nome">BISMARCK DE FIGUEIREDO BARBOSA</div>
    <div class="qrcode-container">
      <!-- Substitua o atributo src pelo caminho da imagem do seu QR Code -->
      <img src="caminho_da_sua_imagem.png" alt="QR Code">
    </div>
  </div>

</body>
</html>
